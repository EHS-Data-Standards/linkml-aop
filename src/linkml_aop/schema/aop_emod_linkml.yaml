name: aopwiki-emod
id: http://example.org/aopwiki-emod
default_prefix: http://example.org/aopwiki-emod/
title: AOP Wiki Data Model with EMOD
description: >-
  A LinkML schema for the AOP-Wiki data model, extended with the EMOD (Evidence Model)
  concepts of Assays, Observations, Evidence, and Biological Target Families. It serves
  two purposes: validating content already curated in the AOP-Wiki, and providing a
  structure for Adverse Outcome Pathways derived by automated approaches, including
  analysis of multimodal data and text mining. Both purposes depend on being able to tell
  what evidence supports from what has been inferred, so the classes and slots are
  defined to keep an observation, the method that produced it, and the mechanism inferred
  from it distinct from one another.
prefixes:
  linkml: https://w3id.org/linkml/
  xsd: http://www.w3.org/2001/XMLSchema#
  foaf: http://xmlns.com/foaf/0.1/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
default_range: string

imports:
  - linkml:types

# Slot defintions shared across multiple classes
slots:
  changed_at:
    description: Timestamp of when the record was last changed
    range: datetime
  created_at:
    description: Timestamp of when the record was created
    range: datetime
  updated_at:
    description: Timestamp of when the record was last updated
    range: datetime

# Class definitions
classes:
  Aop:
    description: An AOP describes a sequence of events commencing with initial interaction(s) of a stressor with a biomolecule within an organism that causes a perturbation in its biology (i.e., molecular initiating event, MIE), which can progress through a dependent series of intermediate key events (KEs) and culminate in an adverse outcome (AO) considered relevant to risk assessment or regulatory decision-making. AOPs are composed of a causal sequence of upstream to downstream KEs, representing a cascading series of measurable biological changes that can be expected to occur if the perturbation is sufficiently severe (i.e., in terms of potency, duration, frequency) to drive the pathway all the way to the AO. Importantly, AOPs do not describe every detail of the biology but instead focus on describing critical steps or check-points along the path to adversity, which are both measurable and have potential predictive value for regulatory application.
    slots:
      - created_at
      - updated_at
    attributes:
      id:
        identifier: true
        range: integer
      title:
      short_name:
      corresponding_author_id:
        range: User
        inlined: true
      abstract:
      authors:
      applicability_of_the_aop:
      key_event_essentiality:
      weight_of_evidence_summary:
      quantitative_considerations:
      optional_considerations:
      overall_assessment:
      background:
      oecd_project:
      oecd_status_id:
        range: OecdStatus
        inlined: true
      graphical_representation_image_uid:
      legacy:
        range: boolean
      overall_assessment_file_uid:
      changed_at:
      development_strategy:
      known_modulating_factors:
      assigned_license_id:
        range: AssignedLicense
        inlined: true
      handbook_id:
        range: Handbook
        inlined: true
      completion_score:
        range: float
      mean_ker_score:
        range: float
      mean_event_score:
        range: float
      has_references:
        range: boolean
      project_129:
        range: boolean
      has_structured_methods:
        range: boolean
      assays:
        multivalued: true
        range: Assay
        inlined: true
        inlined_as_list: true
      prototypical_stressors:
        multivalued: true
        range: AopToPrototypicalStressor
        inlined: true
        inlined_as_list: true
      events:
        multivalued: true
        range: AopToEvent
        inlined: true
        inlined_as_list: true
      ke_relationships:
        multivalued: true
        range: AopToKeRelationship
        inlined: true
        inlined_as_list: true
      life_stages:
        multivalued: true
        range: AopToLifeStage
        inlined: true
        inlined_as_list: true
      sexes:
        multivalued: true
        range: AopToSex
        inlined: true
        inlined_as_list: true
      taxons:
        multivalued: true
        range: AopToTaxon
        inlined: true
        inlined_as_list: true
  Event:
    description: >-
      An Event is a measurable biological change at a defined level of biological organization, described in the abstract so that it can be measured and supported by evidence. An Event may be described in the AOP-Wiki before it is used anywhere, and becomes a Key Event when it is incorporated into an Adverse Outcome Pathway. The AOP-Wiki defines a Key Event as "a change in biological or physiological state that is both measurable and essential to the progression of a defined biological perturbation leading to a specific adverse outcome." Within a pathway, the Key Events at the starting and ending positions are Molecular Initiating Events and Adverse Outcomes, and those between them are intermediate Key Events. These positions are recorded per pathway and rest on the mechanistic evidence available to the authors of that pathway, so one Event may serve as a Molecular Initiating Event in one Adverse Outcome Pathway and as an intermediate Key Event in another.


      Whether an Event's change can be measured experimentally depends on factors such as the level of biological organization and the species. Molecular and cellular changes can be tested and measured in model organisms in a laboratory context. Changes up to the population level can be observed in model organisms in a lab and in ecological indicator species. Changes at the individual or population level in humans are observed through epidemiological and clinical studies rather than tested.


      An Event is a type of change rather than a particular occurrence of one, and is therefore not an exposure event in an open system: the exposure of a population to a pollutant in air or water is not an Event. Such real-world exposures can rarely be observed at the molecular level, so the Molecular Initiating Event that follows one is not usually observable at the time of the exposure event. Describing Events in the abstract keeps supporting evidence separate from what is inferred.
    slots:
      - created_at
      - updated_at
    attributes:
      id:
        identifier: true
        range: integer
      title:
        description: A descriptive phrase which defines a discrete biological change that can be measured.
      short_name:
        description: A reasonable abbreviation of the Key Event title, used in labelling throughout AOP-Wiki.
      biological_organization_id:
        description: The level of biological organization at which the Key Event occurs (e.g., molecular, cellular, tissue, organ, organism).
        range: LevelOfBiologicalOrganization
        inlined: true
      how_it_works:
        description: The mechanistic basis explaining how perturbation of this Key Event leads to downstream effects.
      measured_or_detected:
        description: A description of the type(s) of measurements that can be employed to evaluate the Key Event and the relative level of scientific confidence in those measurements.
      supporting_tax_evidence:
        description: Evidence describing the taxonomic applicability of the Key Event, using Latin or common names of species or broader taxonomic groupings.
      evidence_for_chemical_initiation:
        description: Documentation of how specific prototypical stressors (generally chemicals) can trigger or perturb this Key Event.
      examples_using_ao:
        description: Examples illustrating the regulatory significance of this Key Event when it serves as an adverse outcome.
      references:
        description: Literature cited in support of this Key Event description.
      definition:
        description: A description of the biological state being observed or measured, the biological compartment in which it is measured, and its general role in the biology.
      organ_term_id:
        description: The organ or tissue in which the Key Event takes place.
        range: OrganTerm
        inlined: true
      cell_term_id:
        description: The cell type in which the Key Event takes place.
        range: CellTerm
        inlined: true
      completion_score:
        description: Calculated metric indicating how complete the Key Event documentation is.
        range: float
      integration_score:
        description: Calculated metric for integration and priority assessment of the Key Event.
        range: float
      has_method_text:
        description: Indicates whether method text has been provided for this Key Event.
      aop_open_for_adoption_count:
        range: integer
      aop_oecd_program_count:
        range: integer
      aop_oecd_endorsed_count:
        range: integer
      event_components:
        multivalued: true
        range: EventComponent
        inlined: true
        inlined_as_list: true
      assays:
        multivalued: true
        range: Assay
        inlined: true
        inlined_as_list: true
      observations:
        multivalued: true
        range: Observation
        inlined: true
        inlined_as_list: true
      bio_target_families:
        multivalued: true
        range: BioTargetFamily
        inlined: true
        inlined_as_list: true
      test_guidelines:
        multivalued: true
        range: TestGuideline
        inlined: true
        inlined_as_list: true
      aops:
        multivalued: true
        range: AopToEvent
        inlined: true
        inlined_as_list: true
      life_stages:
        multivalued: true
        range: EventToLifeStage
        inlined: true
        inlined_as_list: true
      sexes:
        multivalued: true
        range: EventToSex
        inlined: true
        inlined_as_list: true
      taxons:
        multivalued: true
        range: EventToTaxon
        inlined: true
        inlined_as_list: true
  KeRelationship:
    description: A scientifically-based relationship that connects one key event to another, defines a causal and predictive relationship between the upstream and downstream event, and thereby facilitates inference or extrapolation of the state of the downstream key event from the known, measured, or predicted state of the upstream key event.
    slots:
      - created_at
      - updated_at
    attributes:
      id:
        identifier: true
        range: integer
      upstream_event_id:
        range: Event
        inlined: true
      downstream_event_id:
        range: Event
        inlined: true
      how_it_works:
      biological_plausibility:
      empirical_support:
      uncertainties:
      quantitative_understanding:
      taxon_evidence:
      weight_of_evidence:
      response_relationship:
      time_scale:
      modulating_factors:
      known_loops:
      evidence_collection_strategy:
      references:
      completion_score:
        range: float
      has_tabulated_evidence:
        range: boolean
      aops:
        multivalued: true
        range: AopToKeRelationship
        inlined: true
        inlined_as_list: true
      taxons:
        multivalued: true
        range: KeRelationshipToTaxon
        inlined: true
        inlined_as_list: true
      sexes:
        multivalued: true
