        inlined: true
        inlined_as_list: true
  Assay:
    description: A defined experimental method for measuring a biological change, structured so that its elements - the biological object measured, the process it takes part in, the detection technology, and the taxa and biological target families it applies to - can be matched against the Key Events the assay can inform. Assays are how New Approach Methodologies (NAMs) connect to Adverse Outcome Pathways, and an assay may be specified by one or more test guidelines. Some assays have an inherent directionality, meaning they are designed to detect change in a specific direction, such as an agonist or an antagonist effect on a specific molecular target.
